<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizChain | Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url('background.jpeg') no-repeat;
    background-size: cover;
    background-position: center;
}

.wrapper{
    width: 400px;
    background: transparent;
    border: 2px solid rgba(255,255,255,.2);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 15px rgba(0,0,0,.2);
    color: #fff;
    border-radius: 20px;
    padding: 25px 30px;
}

.wrapper h1{
    font-size: 26px;
    text-align: center;
    margin-bottom: 10px;
}

.input-box{
    position: relative;
    width: 100%;
    height: 45px;
    margin: 12px 0;
}

.input-box input,
.input-box select{
    width: 100%;
    height: 100%;
    background: transparent;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 40px;
    font-size: 13px;
    color: #fff;
    padding: 0 40px 0 15px;
    outline: none;
}

.input-box input::placeholder{
    color: black;
}

.input-box select{
    color: black;
    appearance: none;
}

.input-box i{
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
}

.pdpa{
    font-size: 11px;
    margin-top: 8px;
    display: flex;
    gap: 6px;
}

.btn{
    width: 100%;
    height: 42px;
    background: #fff;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
}

.login-link{
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
}

.login-link a{
    color: #fff;
    font-weight: 600;
    text-decoration: none;
}
.custom-file {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 40px;
    padding: 0 40px 0 15px; /* same as text input padding */
    background: transparent;
    color: #fff;
    position: relative;
    cursor: pointer;
}

.custom-file input[type="file"] {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0; /* hide native input */
    cursor: pointer;
}

.custom-file .file-text {
    pointer-events: none; /* allow clicking the hidden input */
    color: #ddd;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="wrapper">
<form method="POST" action="signup.php" enctype="multipart/form-data">

<h1>SIGN UP</h1>

<div class="input-box">
    <input type="text" name="fullname" placeholder="Full Name" required>
    <i class="bi bi-person"></i>
</div>

<div class="input-box">
    <input type="text" name="ic" placeholder="IC Number" required>
    <i class="bi bi-credit-card"></i>
</div>

<div class="input-box">
    <select name="gender" required>
        <option value="">Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Rather Not To Say</option>
    </select>
    <i class="bi bi-person-lines-fill"></i>
</div>

<div class="input-box">
    <input type="text" name="username" placeholder="Username" required>
    <i class="bi bi-person-circle"></i>
</div>

<div class="input-box">
    <input type="text" name="phonenum" placeholder="Phone Number" required>
    <i class="bi bi-telephone"></i>
</div>

<div class="input-box">
    <input type="email" name="email" placeholder="Email Address" required>
    <i class="bi bi-envelope"></i>
</div>

<div class="input-box">
    <input type="password" name="password" placeholder="Password" required>
    <i class="bi bi-lock"></i>
</div>

<div class="input-box">
    <input type="password" name="confirmpassword" placeholder="Confirm Password" required>
    <i class="bi bi-shield-lock"></i>
</div>

<div class="input-box">
    <label class="custom-file">
        <input type="file" name="profile_picture" accept="image/*">
        <span class="file-text">Choose Profile Picture</span>
    </label>
    <i class="bi bi-image"></i>
</div>

<div class="pdpa">
    <input type="checkbox" name="pdpa" required>
    <span>I consent to the collection and processing of my personal data in accordance with the Privacy Policy and agree to the Terms of Service.</span>
</div>

<button type="submit" class="btn">Sign Up</button>

<div class="login-link">
    <p>Already have an account? <a href="login.html">Login</a></p>
</div>

</form>
</div>

</body>
</html>
