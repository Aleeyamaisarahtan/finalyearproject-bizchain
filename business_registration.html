<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Business Company</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
}

.register-container {
    background-color: #fff;
    width: 600px;
    margin: 60px auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

.register-container h2 {
    text-align: center;
    margin-bottom: 25px;
}

h3 {
    margin-top: 20px;
    margin-bottom: 10px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 5px;
    font-size: 18px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

input[type="file"] {
    padding: 6px;
}

button {
    width: 100%;
    padding: 14px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

input[type="checkbox"] {
    width: auto;
    margin-right: 10px;
}

button:hover {
    background-color: #0056b3;
}

.note {
    font-size: 13px;
    color: #666;
    margin-top: 15px;
    text-align: center;
}

@media (max-width: 600px) {
    .register-container {
        width: 90%;
    }
}
</style>
</head>
<body>

<div class="register-container">
    <h2>Register Business Company</h2>

    <form action="business_registration.php" method="post" enctype="multipart/form-data">

        <h3>Business Information</h3>

        <label>Company Name</label>
        <input type="text" name="company_name" required>

        <label>SSM Registration Number</label>
        <input type="text" name="ssm_reg_no" required>

        <label>Upload SSM Certificate</label>
        <input type="file" name="ssm_certificate" accept=".pdf,.jpg,.jpeg,.png" required>

        <label>Business Type (Legal Structure)</label>
        <select id="businessType" name="business_type" onchange="toggleOther('businessType','otherBusinessType')" required>
            <option value="">-- Select Business Type --</option>
            <option>Sole Proprietorship</option>
            <option>Partnership</option>
            <option>Private Limited (Sdn Bhd)</option>
            <option>Public Limited (Berhad)</option>
            <option>Non-Profit Organisation</option>
            <option value="Others">Others</option>
        </select>

        <input type="text" id="otherBusinessType" name="other_business_type"
               placeholder="Please specify" style="display:none; margin-top:10px;">

        <label>Business Field / Industry</label>
        <select id="businessField" name="business_field" onchange="toggleOther('businessField','otherBusinessField')" required>
            <option value="">-- Select Business Field --</option>
            <option>Food & Beverage (F&B)</option>
            <option>Retail</option>
            <option>Wedding & Event</option>
            <option>Technology / IT</option>
            <option>Finance / Banking</option>
            <option>Health & Wellness</option>
            <option>Education</option>
            <option value="Others">Others</option>
        </select>

        <input type="text" id="otherBusinessField" name="other_business_field"
               placeholder="Please specify" style="display:none; margin-top:10px;">

        <label>Business Address</label>
        <textarea name="business_address" required></textarea>

        <label>Company Email</label>
        <input type="email" name="company_email" required>

        <label>Business Contact Number</label>
        <input type="tel" name="business_contact_number" required>

        <label>Facebook (Optional)</label>
        <input type="text" name="facebook">

        <label>Instagram (Optional)</label>
        <input type="text" name="instagram">

        <label>TikTok (Optional)</label>
        <input type="text" name="tiktok">

        <label>Website (Optional)</label>
        <input type="text" name="website">

        <label style="display: flex; align-items: flex-start; font-size: 14px; line-height: 1.4; color: #333; margin-top: 15px;">
            <input type="checkbox" required style="margin-top: 2px;">
             I consent to the collection and processing of my personal data in accordance with the Privacy Policy and agree to the Terms of Service.
        </label>

        <button type="submit">Register Company</button>
    </form>

    <p class="note">
        ⚠️ Please ensure all information is accurate. Incorrect details or missing SSM certificate may delay verification.
    </p>
</div>

<script>
function toggleOther(selectId, inputId) {
    const select = document.getElementById(selectId);
    const input = document.getElementById(inputId);

    if (select.value === "Others") {
        input.style.display = "block";
    } else {
        input.style.display = "none";
        input.value = "";
    }
}

// Capitalize first letter of each word for "Others"
function toTitleCase(str) {
    return str.replace(/\w\S*/g, function(txt){
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    });
}

document.getElementById("otherBusinessType").addEventListener("input", function() {
    this.value = toTitleCase(this.value);
});

document.getElementById("otherBusinessField").addEventListener("input", function() {
    this.value = toTitleCase(this.value);
});
</script>

</body>
</html>
